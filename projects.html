<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Raunak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="global.js"></script>
  <script type="module" src="projects.js"></script>
</head>
<body>
  <main>
    <h1 class="projects-title">Projects</h1>

    <div class="container">
      <svg id="projects-pie-plot" viewBox="-50 -50 100 100" role="group" aria-label="Pie chart of projects per year. Select a slice to filter projects by year."></svg>
      <ul class="legend" aria-label="Projects per year"></ul>
    </div>

    <input class="searchBar" type="search" aria-label="Search projects" placeholder="🔍 Search projects…">
    <p class="filter-status" aria-live="polite"></p>

    <div class="projects">
      <!-- Projects are loaded from projects.json by projects.js -->
    </div>
  </main>
</body>
</html>
